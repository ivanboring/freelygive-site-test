# @todo Delete this file when https://www.drupal.org/i/3635625 is released.
additional_trusted_composer_plugins:
  # Added indirectly by `drupal/core-dev`.
  - tbachert/spi
  # Explicitly allowed by the Drupal CMS project template.
  - drupal/site_template_helper
# Package Manager has a very narrow idea of what "unknown files" are, and it
# tends to break by excluding necessary files, ike patches or recipes, that it
# doesn't know about. We don't want end users to be thwarted by Package Manager's
# bad assumptions, so we include "unknown" files in sandbox operations.
include_unknown_files_in_project_root: true
