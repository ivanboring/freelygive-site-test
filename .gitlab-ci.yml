workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
  auto_cancel:
    on_new_commit: interruptible

stages:
  - install
  - test

default:
  interruptible: true

variables:
  GIT_STRATEGY: none

image: node:24

canvas-install:
  stage: install
  variables:
    GIT_STRATEGY: fetch
  cache:
    key:
      files:
        - package-lock.json
    fallback_keys:
      - npm-
    paths:
      - .npm/
  script:
    - npm ci --cache .npm
  artifacts:
    paths:
      - ./
    expire_in: 1 hour

canvas-lint:
  stage: test
  needs: [canvas-install]
  script:
    - npm run code:check

# Regenerate the ambient @/components/<name> declarations and fail if the
# committed file is stale. The Vite plugin regenerates during dev via
# `emitTypes: true`, but the committed file is what `tsc --noEmit` reads, so a
# missed regeneration would otherwise only surface locally.
gen-types-check:
  stage: test
  needs: [canvas-install]
  script:
    - npm run gen:types
    - git diff --exit-code src/types/canvas-components.d.ts

canvas-validate:
  stage: test
  needs: [canvas-install]
  # Safety net against an interactive-prompt hang tying up a runner.
  timeout: 10 minutes
  # Without credentials the CLI validates the LOCAL component / page /
  # content-template schema (what we want in CI). Set unreachable placeholders
  # so the content-template phase doesn't prompt for a site URL / client id and
  # hang on the missing TTY, and close stdin as a belt-and-braces guard.
  variables:
    CANVAS_SITE_URL: 'https://example.com'
    CANVAS_CLIENT_ID: 'ci'
    CANVAS_CLIENT_SECRET: 'ci'
  script:
    - npx canvas validate < /dev/null

canvas-test:
  stage: test
  needs: [canvas-install]
  cache:
    key:
      files:
        - package-lock.json
      prefix: playwright
    fallback_keys:
      - playwright-
    paths:
      - .playwright-cache/
  variables:
    PLAYWRIGHT_BROWSERS_PATH: $CI_PROJECT_DIR/.playwright-cache
  script:
    - npx playwright install --with-deps chromium
    - npm test
