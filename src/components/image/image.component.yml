name: Image
machineName: image
status: true
required: []
props:
  properties:
    image:
      title: Image
      type: object
      description: The image to show. Nothing is displayed until one is chosen.
      examples:
        - src: >-
            https://placehold.co/800x600@2x.png?alternateWidths=https%3A%2F%2Fplacehold.co%2F%7Bwidth%7Dx%7Bheight%7D%402x.png
          alt: Example image placeholder
          width: 800
          height: 600
      $ref: json-schema-definitions://canvas.module/image
    alignment:
      title: Alignment
      type: string
      examples:
        - left
      enum:
        - left
        - center
      meta:enum:
        left: Left
        center: Centered
    maxWidth:
      title: Max Width
      type: string
      description: Upper limit on the displayed image width on larger screens.
      examples:
        - none
      enum:
        - none
        - small
        - medium
        - large
      meta:enum:
        none: None (fill the container)
        small: Small
        medium: Medium
        large: Large
slots: []
