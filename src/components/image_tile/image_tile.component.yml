name: Image tile
machineName: image_tile
status: true
required:
  - title
  - link
props:
  properties:
    image:
      title: Image
      type: object
      description: Background photo. Without one, only the titled band is shown.
      $ref: json-schema-definitions://canvas.module/image
      examples:
        - src: >-
            https://placehold.co/624x594@2x.png?alternateWidths=https%3A%2F%2Fplacehold.co%2F%7Bwidth%7Dx%7Bheight%7D%402x.png
          alt: Example tile photo
          width: 624
          height: 594
    title:
      title: Title
      type: string
      examples:
        - Talks
    link:
      title: Link
      type: string
      format: uri-reference
      examples:
        - /blog
slots: []
