# Storybook + browser tooling for this project. Merged into the DDEV project
# config generated by the One Line Installer (which owns config.yaml — project
# type and docroot). Applies to both the storybook and drupal-cms configs.
#
# This file carries ALL recurring, per-start setup so the project stands up with
# plain `ddev start` / `ddev restart` alone — no installer re-run. One-time
# scaffold steps (git re-init, rename, Canvas wiring, baseline commit) live in
# the .drupalaibp/ install hooks instead.

# Playwright downloads its browsers here; the path is a DDEV global-cache mount,
# so chromium survives image rebuilds and is shared across projects. agent-browser
# reads PLAYWRIGHT_BROWSERS_PATH too and reuses this same chromium — no separate
# Chrome download needed.
web_environment:
  - PLAYWRIGHT_BROWSERS_PATH=/mnt/ddev-global-cache/playwright-browsers

# Expose the Storybook dev server (container port 6006) on the router.
web_extra_exposed_ports:
  - name: storybook
    container_port: 6006
    http_port: 6005
    https_port: 6006

# Run Storybook as a managed daemon. It crash-loops until node_modules exists;
# the post-start hook below installs deps and restarts it deterministically.
web_extra_daemons:
  - name: storybook
    command: "npm run dev -- --host=0.0.0.0"
    directory: /var/www/html

hooks:
  post-start:
    # 1. Node deps + browsers, then bring the Storybook daemon up. Guarded on
    #    package.json so the drupal-cms first start (before the repo overlay
    #    lands) is a clean no-op.
    #
    #    Ordering is load-bearing: supervisor auto-restarts the storybook
    #    daemon the moment node_modules appears, so a daemon that wins that
    #    race builds its manager cache from a half-installed tree and then
    #    serves empty/corrupted bundles indefinitely. Stop it first, install
    #    against a quiet tree, drop the (possibly poisoned) storybook cache,
    #    and start it last. The install guard checks for the storybook
    #    binary, not the bare directory - a crash-looping daemon or an
    #    interrupted npm ci leaves a node_modules that exists but is broken.
    - exec: |
        if [ -f package.json ]; then
          supervisorctl stop webextradaemons:storybook >/dev/null 2>&1 || true
          # .package-lock.json is deleted at the start of npm ci and only
          # rewritten when it completes, so its absence marks an interrupted
          # install even when the storybook binary itself survived.
          if [ ! -x node_modules/.bin/storybook ] || [ ! -f node_modules/.package-lock.json ]; then
            echo "Installing npm dependencies..."
            npm ci || npm install
          fi
          rm -rf node_modules/.cache/storybook
          echo "Ensuring Playwright chromium is installed (shared with agent-browser)..."
          npx --yes playwright install chromium || true
          if [ -x node_modules/.bin/agent-browser ]; then
            ln -sf /var/www/html/node_modules/.bin/agent-browser /usr/local/bin/agent-browser || true
          fi
          supervisorctl restart webextradaemons:storybook || true
        fi
    # 2. Trust the DDEV/mkcert CA inside the container so headless Chrome (vitest
    #    browser mode and agent-browser) can load https://*.ddev.site pages.
    - exec: |
        mkdir -p "$HOME/.pki/nssdb"
        [ -f "$HOME/.pki/nssdb/cert9.db" ] || certutil -d sql:"$HOME/.pki/nssdb" -N --empty-password || true
        if command -v mkcert >/dev/null 2>&1; then
          certutil -d sql:"$HOME/.pki/nssdb" -A -t "C,," -n mkcert-ca -i "$(mkcert -CAROOT)/rootCA.pem" 2>/dev/null || true
        fi
