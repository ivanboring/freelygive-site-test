# Codex CLI configuration for this project. Merged into the DDEV project config
# generated by the One Line Installer (which owns config.yaml).
#
# Codex has no project-scoped MCP config: it reads $CODEX_HOME/config.toml, and
# CODEX_HOME defaults to ~/.codex. That default does not survive here — the
# ddev-assistant-codex add-on mirrors the HOST ~/.codex into the container on
# every start and does `sudo rm -rf` on the target first, so anything written to
# the container's ~/.codex (by `ddev codex mcp add`, say) is gone on the next
# `ddev start`.
#
# Pointing CODEX_HOME at the project instead makes the MCP registration that
# `ddev mcp-setup` writes durable and version-controlled: .codex/config.toml is
# committed, and the rest of CODEX_HOME (sessions, logs, history, auth.json) is
# gitignored.
#
# Trade-off: `ddev codex` no longer reads the host's ~/.codex, so it does not
# inherit a host login. Authenticate the container's codex once with
# `ddev codex login`; the credentials land in the gitignored .codex/auth.json.
web_environment:
  - CODEX_HOME=/var/www/html/.codex
